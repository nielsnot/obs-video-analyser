dock.menu.help="Help for this dock..."
Help.dock.name="the dock"
Help.dock="<h2>The Video Analyser dock</h2><p>A dock holds the ROI view (the picture with your selection) and any number of scopes. Right click anywhere for the menu.</p><h3>Views</h3><p>Every tab is a view: its own set of scopes and arrangement on the same source. Add one with + in the toolbar; double click a tab to rename it, right click for more. Hotkeys switch views in every dock at once (next, previous, view 1 to 5).</p><h3>Arranging</h3><p>Layout in the menu: a grid, vertical, horizontal or free. In free layout (Arrange button) you move and resize tiles with the mouse. <b>All scopes in a row the same width</b> and <b>in a column the same height</b> even them out.</p><h3>Layout library</h3><p><b>Save this view as a layout</b> keeps the scopes, their settings and the arrangement under a name. Every dock can open it again as a new view, on its own source. Layouts are not part of a scene collection, so they are there in every collection.</p><h3>Snapshot and compare</h3><p><b>Snapshot</b> freezes the current frame and the traces of the scopes; <b>Compare</b> shows them next to live (wipe left/right or top/bottom, or a blend, in the ROI properties). The <b>snapshot library</b> (menu, or right click on Snapshot) saves snapshots as PNG files with a name template, shows them as thumbnails and loads one as the reference picture. A loaded picture is only the picture: the traces of the scopes are not stored in it. You can let every snapshot be saved by itself (off by default).</p><h3>Pause</h3><p><b>Pause</b> stops every scope in every dock on the current frame until you resume, from the toolbar, the menu or a hotkey.</p><h3>Signal path</h3><p>Shows where the measured signal comes from: the source and its type, whether the raw signal filter is used (format, bit depth, range, transfer), the OBS project format, how the scopes capture it (8-bit or float, scale), a LUT, the selection and the scopes.</p><h3>Hotkeys</h3><p>In OBS Settings, Hotkeys, look for Video Analyser: waveform zoom, peaks, views, snapshot, compare and pause. A Stream Deck can use them too.</p><h3>Settings and backup</h3><p>Tools, <b>Video Analyser Settings and Backup</b>: export everything to a file, import it (also on another computer), or a factory reset. A backup is made by itself before an import or reset.</p>"
