# help (the i button on a scope)
Help.Button.tip="Click for an explanation of this scope"
Help.Title="About: %1"
Help.Close="Close"
Help.waveform="<h2>Waveform</h2><p>Shows the brightness of the picture from left to right. Every column of the picture becomes a column of the waveform; a pixel is drawn high when it is bright and low when it is dark.</p><h3>How to read it</h3><ul><li>Bottom (0%) is black, top (100%) is the brightest legal white. Above 100% or below 0% is outside the legal range.</li><li>A bright band at the very top that runs flat is clipping: detail is lost there.</li><li>A flat band at the bottom is crushed black.</li><li>Parade shows R, G and B side by side: on a white or grey object the three should be at the same height. If one is higher, the white balance is off toward that color.</li><li>Skin usually sits around 60–70% on a well exposed face (SDR).</li><li>On a video source (a capture card such as a Blackmagic, a camera, a media file) the waveform shows the raw signal from −7% to 109%: superwhite above 100% and sub-black below 0% are visible. The label at the bottom right says what arrives, for example RAW 10-bit V210. For a Blackmagic, set its Pixel format to 10-bit YUV. On a scene or the program the picture is 8-bit and anything beyond 0–100% is already clipped by OBS.</li><li>The two thin lines are the highest and lowest level in the picture, with their value.</li></ul><h3>What you use it for</h3><ul><li>Set exposure: open the iris until the brightest important part is just under 100%.</li><li>Match cameras: put two waveforms next to each other, or take a Snapshot and Compare.</li><li>Check white balance with the RGB parade on a white or grey card.</li></ul><h3>In this scope</h3><ul><li><b>Int</b> – how bright the trace is drawn.</li><li><b>Grid</b> – lines with the levels.</li><li><b>Color</b> – draw the trace in the colors of the picture.</li><li><b>Gain</b> – enlarges the trace vertically (2x, 5x) to see small differences.</li><li><b>Markers</b> – lines at a level of your own (for example 70% for skin). Click Markers, then drag a line; the percentage on the right follows. Recolor and Delete act on the selected one.</li><li>More options (parade, overlay, scale in % / IRE / 10-bit / nits, histogram along the edge): right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.vectorscope="<h2>Vectorscope</h2><p>Shows the colors of the picture on a circle. The direction from the center is the hue; the distance from the center is the saturation. Brightness is not shown.</p><h3>How to read it</h3><ul><li>A dot in the center is grey, white or black: no color.</li><li>The small boxes are the targets of the color bars (red, magenta, blue, cyan, green, yellow). The 75% boxes are for normal color bars.</li><li>The skin tone line runs between red and yellow. Skin of every complexion lies close to that line; only the distance from the center differs.</li><li>If the whole trace is shifted away from the center while the scene has white or grey in it, the white balance is off toward that direction.</li><li>A trace that reaches beyond the boxes is very saturated and can be outside the legal range.</li></ul><h3>What you use it for</h3><ul><li>Check white balance: aim at a white or grey card, the trace should be a dot in the center.</li><li>Check skin tones: select a face with a rectangle or ellipse (or ☺ Faces) and see whether it lies on the skin tone line.</li><li>Match cameras: Snapshot one camera, switch, and Compare.</li></ul><h3>In this scope</h3><ul><li><b>Int</b>, <b>Grid</b> – brightness of the trace and the graticule.</li><li><b>Color</b> – show the trace in the colors of the picture instead of white.</li><li><b>Gain</b> – zoom in on the center (2x, 5x) for small color casts; the circle and boxes stay in place.</li><li><b>Markers</b> – your own points or lines at a hue and saturation, for example the skin tone of a presenter. Click Markers and drag them.</li><li>More options (lows / mids / highs only, hue ring, degree scale): right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.histogram="<h2>Histogram</h2><p>Counts how many pixels there are at each brightness: dark on the left, bright on the right. The height is the number of pixels.</p><h3>How to read it</h3><ul><li>A peak against the left edge means many pixels are black: crushed shadows.</li><li>A peak against the right edge means many pixels are clipped white.</li><li>The shape depends on the scene: a dark scene has most pixels on the left, which is fine.</li><li>In RGB mode the three colors are shown; on a neutral scene they lie on top of each other.</li></ul><h3>What you use it for</h3><ul><li>Quick check of exposure and clipping.</li><li>See whether the picture uses the whole range.</li></ul><h3>In this scope</h3><ul><li>Components (luma or RGB), log scale and graticule: right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.zebra="<h2>Zebra</h2><p>Draws stripes over the parts of the picture that are brighter than a level you choose, like the zebra on a camera.</p><h3>How to read it</h3><ul><li>Stripes appear where the picture is above the threshold.</li><li>With a threshold of 95–100% the stripes show what is (almost) clipped.</li><li>With a threshold around 70% the stripes show where a face is correctly exposed.</li></ul><h3>What you use it for</h3><ul><li>Avoid clipped highlights while you set the iris.</li><li>Find hot spots on faces or white shirts.</li></ul><h3>In this scope</h3><ul><li>Thresholds (lower and high) and the color space: right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.falsecolor="<h2>False color</h2><p>Paints the picture in colors by brightness: every band of levels gets its own color. The key below the picture shows which color means which level.</p><h3>How to read it</h3><ul><li>Purple / blue: black and deep shadows.</li><li>Grey or green: mid grey (about 18% grey).</li><li>Pink: skin tones at a good exposure.</li><li>Yellow: highlights near the top.</li><li>Red: clipped.</li></ul><h3>What you use it for</h3><ul><li>Set exposure for a face: open up until the face turns pink.</li><li>See at once where the picture clips (red) or is crushed (purple).</li></ul><h3>In this scope</h3><ul><li>Color schemes (exposure, clipping only, skin and mid grey, spectrum, HLG levels, custom), where the key goes, and a LUT: right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.focuspeaking="<h2>Focus peaking</h2><p>Draws a colored outline over the sharpest edges in the picture.</p><h3>How to read it</h3><ul><li>Where the outline is strongest, the picture is in focus.</li><li>When you turn the focus ring the outline moves through the picture: stop where it lies on the eyes.</li><li>A soft or noisy picture shows little peaking; lower the threshold then.</li></ul><h3>What you use it for</h3><ul><li>Pull focus on a person or object.</li><li>Check that the camera has not drifted out of focus.</li></ul><h3>In this scope</h3><ul><li>Color, threshold and actual size (1:1 pixels): right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.diamond="<h2>Gamut diamond</h2><p>The Tektronix diamond shows whether R, G and B stay within the legal range. The upper diamond is green against blue, the lower one green against red.</p><h3>How to read it</h3><ul><li>Black is at the bottom point, white at the top point, grey in a vertical line in the middle.</li><li>Everything inside the two diamonds is legal. A trace beyond the edge means a color is out of range.</li><li>A vertical line that leans to one side means the greys have a color: the white balance is off.</li></ul><h3>What you use it for</h3><ul><li>Broadcast QC: check that no colors go out of gamut.</li><li>Check that greys are neutral from black to white.</li></ul><h3>In this scope</h3><ul><li><b>Color</b> – show the trace in the colors of the picture.</li><li>Labels and trace color: right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.cie="<h2>CIE chart</h2><p>Shows the colors of the picture on the CIE 1931 chart: the horseshoe is every color the eye can see, the triangles are what Rec. 709, DCI-P3 and Rec. 2020 can show.</p><h3>How to read it</h3><ul><li>Points inside the Rec. 709 triangle can be shown on an HD screen.</li><li>Points outside it (with HDR or wide color) cannot be shown in HD and are clipped or changed when converted.</li><li>White lies near the D65 point in the middle.</li></ul><h3>What you use it for</h3><ul><li>Check whether wide gamut or HDR material stays within Rec. 709.</li><li>See how saturated a light or a set is.</li></ul><h3>In this scope</h3><ul><li>Which triangles are shown: right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.qc="<h2>QC</h2><p>Quality control: checks the picture all the time and shows a line per check with a green OK or an orange problem, a log and a timeline.</p><h3>How to read it</h3><ul><li>Clipped whites / crushed blacks: more of the picture than allowed is at the limits.</li><li>RGB at the limits: one of R, G, B is at the edge of the range even if the luma is fine.</li><li>Black borders, black picture and frozen picture: for a lost or stuck signal.</li><li>Dead or stuck pixels: a pixel that stays much darker or brighter than its neighbours.</li><li>MaxCLL / MaxFALL (HDR): the brightest pixel and the brightest frame average.</li><li>Outside the preferred range (raw signal): on a video source, luma or R, G, B below −5% or above 105%, the preferred range of EBU R103 (10-bit codes 20 to 984). R103 uses the same range for SDR, HLG and PQ.</li></ul><h3>What you use it for</h3><ul><li>Keep an eye on a stream or recording without looking at the scopes all the time.</li><li>Find out afterwards when a problem happened (log and CSV file).</li></ul><h3>In this scope</h3><ul><li>Which checks, limits, allowed share and the log file: right-click the tile, <i>More settings</i>. Reset clears the log and MaxCLL.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.satlum="<h2>Saturation / luminance</h2><p>Every pixel is placed by its brightness (up) and its saturation (to the right).</p><h3>How to read it</h3><ul><li>Colorful highlights or shadows end up in the top right or bottom right.</li><li>Bright, very saturated colors can look harsh and may go out of gamut.</li><li>Normal pictures get less saturated toward white and black.</li></ul><h3>What you use it for</h3><ul><li>Find colors that are too strong in the highlights (for example lights on stage).</li></ul><h3>In this scope</h3><ul><li>Colored trace: right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.lineplot="<h2>Line plot</h2><p>The levels of one line of the picture, from left to right, like an oscilloscope on a single picture line.</p><h3>How to read it</h3><ul><li>The height is the level of each pixel on that line.</li><li>Separate R, G and B lines show the color along the line.</li></ul><h3>What you use it for</h3><ul><li>Check a gradient, a lit wall or a test chart in detail.</li><li>See exactly where a picture line clips.</li></ul><h3>In this scope</h3><ul><li>Which picture line (in % from the top): right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.info="<h2>Info</h2><p>A single line of text: the timecode (time of day), the clock, the date, the video format of OBS or a text of your own.</p><h3>How to read it</h3><ul><li>The timecode is hours:minutes:seconds:frames at the frame rate of OBS.</li></ul><h3>What you use it for</h3><ul><li>A clock and timecode next to the scopes for a log or for the crew.</li><li>A label such as the camera name.</li></ul><h3>In this scope</h3><ul><li>What it shows and the text: right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.audio="<h2>Audio</h2><p>Audio meters with loudness after EBU R128, true peaks, a phase meter and a goniometer.</p><h3>How to read it</h3><ul><li>Momentary, short-term and integrated loudness in LUFS; the target (for example −23 LUFS) is marked.</li><li>Peaks near 0 dBFS distort.</li><li>Phase near +1 is mono-compatible; toward −1 the left and right cancel out in mono.</li><li>The goniometer: a vertical line is mono, a wide cloud is a wide stereo picture, a horizontal line is out of phase.</li></ul><h3>What you use it for</h3><ul><li>Keep the stream at the loudness the platform asks for.</li><li>Check that stereo is not out of phase.</li></ul><h3>In this scope</h3><ul><li>Audio source, target, timeline: right-click the tile, <i>More settings</i>. Reset restarts the integrated loudness.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.cube="<h2>3D color cube</h2><p>Every pixel as a point in an RGB cube: black in one corner, white in the opposite one, and the primary colors at the other corners.</p><h3>How to read it</h3><ul><li>The line from black to white through the middle is grey. Points far from it are saturated.</li><li>A picture with a color cast bends away from that grey line.</li></ul><h3>What you use it for</h3><ul><li>See how a LUT or grade moves the colors.</li><li>Understand the colors of a scene at a glance.</li></ul><h3>In this scope</h3><ul><li>Drag with the mouse to turn the cube. Speed of turning, point size and edges: right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.faces="<h2>Faces (experimental)</h2><p>Finds faces in the picture and measures the exposure of the scene and the skin tone of a face: brightness, hue, saturation and the distance to the skin tone line.</p><h3>How to read it</h3><ul><li>The left table is the scene: median, P10, P90, P99, near black and near clipping.</li><li>The right table compares the face with a reference: Reference | Difference | Live. A green check means within tolerance; the bar shows how big the difference is.</li><li>An explanation appears only when a value is outside the tolerance.</li><li>With more faces in the picture, click a face to choose which one is measured.</li></ul><h3>What you use it for</h3><ul><li>Keep skin tones the same over a show: <b>Set reference</b> when it looks right, and watch for differences.</li><li>Match cameras: Snapshot on camera A, switch to camera B and Compare.</li></ul><h3>In this scope</h3><ul><li><b>Set reference</b> – this face is how it should look (kept with the settings).</li><li><b>Clear reference</b> – remove it.</li><li>☺ Faces in the toolbar makes all scopes measure only the faces.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
Help.chart="<h2>Color chart</h2><p>Measures a 24-patch color chart (ColorChecker layout) in the picture and compares every patch with a reference: another camera, or the published values.</p><h3>How to read it</h3><ul><li>The grid shows every patch: the reference on top, live below, with the Delta E (color difference) per patch. Below about 2 is hardly visible; above 5 is clearly different.</li><li>The table shows the greys (exposure), red and blue against green (white balance), saturation and the hue of the six primary colors.</li><li>A green check is within tolerance; an orange mark and a short explanation appear when something is off.</li></ul><h3>What you use it for</h3><ul><li>Fill the selection with the chart (draw a rectangle around it), check the layout (rotated or not).</li><li>Match cameras: <b>Set reference</b> on the camera that looks right, then show the chart to the other camera and adjust until the checks are green.</li></ul><h3>In this scope</h3><ul><li><b>Set reference</b> / <b>Clear reference</b> – keep or remove the reference camera.</li><li>Layout of the chart and the reference (camera or published values): right-click the tile, <i>More settings</i>.</li></ul><p><small>Tip: the selection on the ROI view (rectangle, ellipse, ☺ Faces) decides which part of the picture is measured. ◉ Snapshot and ⇆ Compare work on every scope.</small></p>"
RawInput="Video Analyser input (raw signal)"
RawInput.AnyTransfer="Also measure the raw signal when the source is SDR in an HDR project (or HDR in an SDR project)"
RawInput.Note="Video Analyser adds this filter by itself to a video source that a scope measures. It keeps the frames as they arrive, before OBS converts them, so the scopes show superwhite and sub-black. It passes every frame on unchanged. Normally the raw signal is used only when the source has the transfer of the project (SDR, HLG or PQ), because OBS converts the others; with the option above you see the source itself instead."
