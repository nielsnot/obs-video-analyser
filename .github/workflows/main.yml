name: Plugin Build

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
    tags:
      - '*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - main

env:
  artifactName: ${{ contains(github.ref_name, '/') && 'artifact' || github.ref_name }}

jobs:
  linux_build:
    runs-on: ${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs: 30
            ubuntu: 'ubuntu-22.04'
          - obs: 31
            ubuntu: 'ubuntu-24.04'
          - obs: 32
            ubuntu: 'ubuntu-24.04'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download obs-studio development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@v2
        with:
          obs: ${{ matrix.obs }}
          verbose: true

      - name: Build plugin
        run: |
          set -ex
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D PKG_SUFFIX=-obs${{ matrix.obs }}-${{ matrix.ubuntu }}-x86_64 \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}
          cd build
          make -j4
          make package
          echo "FILE_NAME=$(find $PWD -name '*.deb' | head -n 1)" >> $GITHUB_ENV
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifactName }}-linux-obs${{ matrix.obs }}-${{ matrix.ubuntu }}
          path: '${{ env.FILE_NAME }}'

      - name: 'Setup with onsdriver'
        uses: noris-plugins-for-obs/onsdriver@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: ${{ env.FILE_NAME }}
          first-time-log: ./logs/

      - name: 'Test with onsdriver'
        run: |
          python -m pip install Pillow
          set -o pipefail
          mkdir -p logs
          python -m unittest discover test-onsdriver/ 2>&1 | tee logs/test-output.txt

      - name: 'Report OBS log problems'
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, re
          for f in sorted(glob.glob('logs/**/*', recursive=True)):
              try:
                  lines = open(f, encoding='utf-8', errors='replace').read().splitlines()
              except (IsADirectoryError, OSError):
                  continue
              hits = [l for l in lines if re.search(r'error|fail|warning|crash|video-analyser', l, re.I)][:60]
              if hits:
                  msg = '%0A'.join(h.replace('%', '%25').replace('\r', '') for h in hits)
                  print(f'::error title={f}::{msg}')
          PY

      - name: 'Upload logs of onsdriver'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ env.artifactName }}-linux-obs${{ matrix.obs }}-${{ matrix.ubuntu }}
          path: |
            logs/*
            screenshots/*

  macos_build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        obs: [30, 31, 32]
        arch: ['universal']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Environment
        id: setup
        run: |
          set -e
          echo '::group::Set up code signing'
          if [[ '${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}' != '' && \
                '${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}' != '' && \
                '${{ secrets.MACOS_SIGNING_CERT }}' != '' ]]; then
            echo "haveCodesignIdent=true" >> $GITHUB_OUTPUT
          else
            echo "haveCodesignIdent=false" >> $GITHUB_OUTPUT
          fi
          if [[ '${{ secrets.MACOS_NOTARIZATION_USERNAME }}' != '' && \
                '${{ secrets.MACOS_NOTARIZATION_PASSWORD }}' != '' ]]; then
            echo "haveNotarizationUser=true" >> $GITHUB_OUTPUT
          else
            echo "haveNotarizationUser=false" >> $GITHUB_OUTPUT
          fi
          echo '::endgroup::'

      - name: Install Apple Developer Certificate
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.MACOS_SIGNING_CERT }}
          p12-password: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Set Signing Identity
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && steps.setup.outputs.haveNotarizationUser == 'true' }}
        run: |
          set -e
          TEAM_ID=$(echo "${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}" | sed 's/.*(\([A-Za-z0-9]*\))$/\1/')
          xcrun notarytool store-credentials AC_PASSWORD \
            --apple-id "${{ secrets.MACOS_NOTARIZATION_USERNAME }}" \
            --team-id "$TEAM_ID" \
            --password "${{ secrets.MACOS_NOTARIZATION_PASSWORD }}"

      - name: Download obs-studio development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@v2
        with:
          path: /tmp/deps-${{ matrix.obs }}-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          obs: ${{ matrix.obs }}
          verbose: true

      - name: Build plugin
        run: |
          arch=${{ matrix.arch }}
          deps=/tmp/deps-${{ matrix.obs }}-${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET=${{ steps.obsdeps.outputs.MACOSX_DEPLOYMENT_TARGET }}
          GIT_TAG=$(sed -n 's/^project([^ ]* VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          PKG_SUFFIX=-${GIT_TAG}-obs${{ matrix.obs }}-macos-${{ matrix.arch }}
          set -e
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$PWD/release/" \
            -DCMAKE_OSX_ARCHITECTURES=${arch/#universal/x86_64;arm64} \
            -D PKG_SUFFIX=$PKG_SUFFIX \
            -D OBS_BUNDLE_CODESIGN_IDENTITY='${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}' \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}
          set -o pipefail
          cmake --build build --config RelWithDebInfo 2>&1 | tee build.log || {
            grep -E 'error' build.log | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Prepare package
        run: |
          set -ex
          . build/ci/ci_includes.generated.sh
          cmake --install build --config RelWithDebInfo --prefix=release
          (cd release/${PLUGIN_NAME}.plugin/Contents && ../../../ci/macos/change-rpath.sh -obs ${{ matrix.obs }} -lib lib/ MacOS/${PLUGIN_NAME})
          cp LICENSE release/${PLUGIN_NAME}.plugin/Contents/Resources/LICENSE-$PLUGIN_NAME

      - name: Codesign
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        run: |
          . build/ci/ci_includes.generated.sh
          set -ex
          files=(
            $(find release/${PLUGIN_NAME}.plugin/ -name '*.dylib')
            release/${PLUGIN_NAME}.plugin/Contents/MacOS/${PLUGIN_NAME}
          )
          for dylib in "${files[@]}"; do
            codesign --force --sign "${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}" "$dylib"
          done
          for dylib in "${files[@]}"; do
            codesign -vvv --deep --strict "$dylib"
          done

      - name: Package
        run: |
          . build/ci/ci_includes.generated.sh
          set -ex
          zipfile=$PWD/package/${PLUGIN_NAME}${PKG_SUFFIX}.zip
          mkdir package
          (cd release/ && zip -r $zipfile ${PLUGIN_NAME}.plugin)
          ci/macos/install-packagesbuild.sh
          packagesbuild \
            --build-folder $PWD/package/ \
            build/installer-macOS.generated.pkgproj

      - name: Productsign
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        run: |
          . build/ci/ci_includes.generated.sh
          pkgfile=package/${PLUGIN_NAME}${PKG_SUFFIX}.pkg
          set -e
          . build/ci/ci_includes.generated.sh
          productsign --sign "${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}" $pkgfile package/${PLUGIN_NAME}-signed.pkg
          mv package/${PLUGIN_NAME}-signed.pkg $pkgfile

      - name: Notarize
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        uses: norihiro/macos-notarize-action@v1
        with:
          path: package/*
          keychainProfile: AC_PASSWORD
          verbose: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifactName }}-macos-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: package/*

      - name: 'Setup with onsdriver'
        uses: noris-plugins-for-obs/onsdriver@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: package/*.zip
          first-time-log: ./logs/
          # OBS 33 logs a GL error on its first run on the hosted macOS runners
          obs-version: '==${{ matrix.obs }}.*'

      - name: 'Test with onsdriver'
        run: |
          python -m pip install Pillow
          set -o pipefail
          mkdir -p logs
          python -m unittest discover test-onsdriver/ 2>&1 | tee logs/test-output.txt

      - name: 'Report OBS log problems'
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, re
          for f in sorted(glob.glob('logs/**/*', recursive=True)):
              try:
                  lines = open(f, encoding='utf-8', errors='replace').read().splitlines()
              except (IsADirectoryError, OSError):
                  continue
              hits = [l for l in lines if re.search(r'error|fail|warning|crash|video-analyser', l, re.I)][:60]
              if hits:
                  msg = '%0A'.join(h.replace('%', '%25').replace('\r', '') for h in hits)
                  print(f'::error title={f}::{msg}')
          PY

      - name: 'Upload logs of onsdriver'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ env.artifactName }}-macos-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: |
            logs/*
            screenshots/*

  windows_build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        obs: [30, 31, 32]
        arch: [x64]
    env:
      visualStudio: 'Visual Studio 17 2022'
      Configuration: 'RelWithDebInfo'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download obs-studio
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@v2
        with:
          obs: ${{ matrix.obs }}
      - name: Build plugin
        run: |
          $CmakeArgs = @(
            '-G', "${{ env.visualStudio }}"
            '-DCMAKE_SYSTEM_VERSION=10.0.18363.657'
          )
          cmake -S . -B build ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS_PS }} @CmakeArgs
          cmake --build build --config RelWithDebInfo -j 4 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ' error ' | Select-Object -First 30 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
          cmake --install build --config RelWithDebInfo --prefix "$(Resolve-Path -Path .)/release"
      - name: Package plugin
        run: ci/windows/package-windows.cmd ${{ matrix.obs }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifactName }}-windows-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: package/*

      - name: 'Setup with onsdriver'
        uses: noris-plugins-for-obs/onsdriver@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: package/*.zip
          first-time-log: ./logs/

      - name: 'Test with onsdriver'
        run: |
          python -m pip install Pillow
          python -m unittest discover test-onsdriver/

      - name: 'Report OBS log problems'
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, re
          for f in sorted(glob.glob('logs/**/*', recursive=True)):
              try:
                  lines = open(f, encoding='utf-8', errors='replace').read().splitlines()
              except (IsADirectoryError, OSError):
                  continue
              hits = [l for l in lines if re.search(r'error|fail|warning|crash|video-analyser', l, re.I)][:60]
              if hits:
                  msg = '%0A'.join(h.replace('%', '%25').replace('\r', '') for h in hits)
                  print(f'::error title={f}::{msg}')
          PY

      - name: 'Upload logs of onsdriver'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ env.artifactName }}-windows-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: |
            logs/*
            screenshots/*

  release:
    # Publishes a release page with every installer once all builds pass:
    # on a push to main when the version in CMakeLists.txt has no release yet,
    # or on a version tag (its packages are added to a release made on GitHub).
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    needs: [linux_build, macos_build, windows_build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=$(sed -n 's/^project([^ ]* VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version $tag"

      - name: Download packages
        if: ${{ steps.version.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.artifactName }}-*
          path: packages
          merge-multiple: true

      - name: Publish
        if: ${{ steps.version.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ls -la packages
          # what is new: this version's section of CHANGELOG.md
          awk -v v="$TAG" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then sed -i '1s/.*/## What is new/' notes.md; echo >> notes.md; fi
          cat >> notes.md <<'NOTES'
          ## Which file do I need?

          Check your OBS version under **Help → About** in OBS, then pick the file with that `obsNN` in its name.
          For **OBS 33** use the `obs32` files.

          | System | File |
          |---|---|
          | Windows | `…-obsNN-Windows-Installer.exe` (or the `.zip` to copy by hand) |
          | macOS (Intel and Apple Silicon) | `…-obsNN-macos-universal.pkg` |
          | Ubuntu / Debian | `…-obsNN-ubuntu-…-x86_64.deb` |

          Close OBS before installing. In OBS, open **Tools → New Video Analyser Dock...**

          **macOS:** the installer is not signed by Apple. If macOS blocks it, right-click the `.pkg` and choose **Open**,
          or allow it under System Settings → Privacy & Security.

          See the [README](https://github.com/${{ github.repository }}#readme) for a quick start guide.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Video Analyser $TAG" \
              --notes-file notes.md
          fi

      - name: Refresh release notes from the changelog
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for v in $(awk '/^## [0-9]/{print $2}' CHANGELOG.md); do
            gh release view "$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || continue
            awk -v v="$v" '/^## /{p = ($2 == v)} p' CHANGELOG.md | sed '1s/.*/## What is new/' > notes-$v.md
            echo >> notes-$v.md
            cat >> notes-$v.md <<'NOTES'
          ## Which file do I need?

          Check your OBS version under **Help → About** in OBS, then pick the file with that `obsNN` in its name.
          For **OBS 33** use the `obs32` files.

          | System | File |
          |---|---|
          | Windows | `…-obsNN-Windows-Installer.exe` (or the `.zip` to copy by hand) |
          | macOS (Intel and Apple Silicon) | `…-obsNN-macos-universal.pkg` |
          | Ubuntu / Debian | `…-obsNN-ubuntu-…-x86_64.deb` |

          Close OBS before installing. In OBS, open **Tools → New Video Analyser Dock...**

          **macOS:** the installer is not signed by Apple. If macOS blocks it, right-click the `.pkg` and choose **Open**,
          or allow it under System Settings → Privacy & Security.

          See the [README](https://github.com/${{ github.repository }}#readme) for a quick start guide.
          NOTES
            gh release edit "$v" --repo "$GITHUB_REPOSITORY" --notes-file notes-$v.md
          done
